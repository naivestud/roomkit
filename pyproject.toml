[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roomkit"
version = "0.1.0"
description = "Speech enhancement and room-acoustics toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chen Ze" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.15.3",
  "soundfile>=0.12.1",
]

[project.optional-dependencies]
neural = ["torch>=2.1"]
test = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4.0", "mypy>=1.8"]

[project.scripts]
roomkit = "roomkit.cli:main"

[project.urls]
Repository = "https://github.com/naivestud/roomkit"

[tool.hatch.build.targets.wheel]
packages = ["src/roomkit"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
