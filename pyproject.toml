[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "roomkit"
version = "0.1.0"
description = "Speech enhancement and room-acoustics toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chen Ze" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/roomkit"]
